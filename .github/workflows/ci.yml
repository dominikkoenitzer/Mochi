name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      # mochi-testbed creates real WS_EX_TOOLWINDOW windows; they skip
      # themselves when the runner has no desktop to draw on.
      - run: cargo test --workspace --all-features
      - name: No test windows left behind
        shell: pwsh
        run: |
          $stragglers = @(Get-Process mochi-testwin -ErrorAction SilentlyContinue)
          if ($stragglers.Count -gt 0) {
              $stragglers | Stop-Process -Force
              throw "$($stragglers.Count) mochi-testwin process(es) survived the test run"
          }
          Write-Output 'no mochi-testwin process left'

  doc:
    name: doc
    runs-on: windows-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: doc
      - run: cargo doc --workspace --all-features --no-deps

  build:
    name: build release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      # The release profile is thin LTO with one codegen unit, so it breaks in
      # ways a debug build does not. Every push walks that path.
      - run: cargo build --release --workspace

  deny:
    name: cargo-deny
    # The one job that is not on Windows: cargo-deny-action is a container
    # action and only runs on a Linux runner. It reads Cargo.lock and the
    # advisory database, and deny.toml pins the graph to the Windows target,
    # so what it audits is the same dependency set the other jobs build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
