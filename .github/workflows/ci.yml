name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Every three hours, on top of every push. Nothing in this repository
  # changes between those runs, which is the point: what changes underneath it
  # does. A new stable Rust, a new runner image, a dependency yanked, a Windows
  # update that moves DWM behaviour. All of those break a build that was green
  # and nobody finds out until the next push, which on a quiet week is days.
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

concurrency:
  # Keyed on the commit for a push and on the branch for a pull request, which
  # is what actually decides this. Relying on `cancel-in-progress` alone did
  # not work: pushes to the default branch were still being cancelled the
  # moment the next one arrived, before a single job had started, so on a busy
  # day most commits on main were checked by nothing at all. Giving every push
  # its own group means no push can supersede another, whatever the flag below
  # evaluates to.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  # Still true for pull requests: a superseded push to a branch under review is
  # the one case where dropping the older run costs nothing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    # Two Windows versions and both profiles, because this is a program made
    # almost entirely of Win32 and DWM behaviour and that behaviour is not the
    # same between releases: cloaking, UIPI and the shell's window list have
    # all changed under it. One runner image proves one Windows.
    #
    # Release as well as debug is not thoroughness for its own sake. A stack
    # overflow shipped here that only ever happened in an unoptimised build,
    # and a release-only difference would be invisible the other way round.
    name: test (${{ matrix.os }}, ${{ matrix.profile }})
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
        profile: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}-${{ matrix.profile }}
      # mochi-testbed creates real WS_EX_TOOLWINDOW windows; they skip
      # themselves when the runner has no desktop to draw on.
      - name: Run the suite
        shell: pwsh
        run: |
          $flags = if ('${{ matrix.profile }}' -eq 'release') { '--release' } else { '' }
          cargo test --locked --workspace --all-features $flags
      - name: No test windows left behind
        shell: pwsh
        run: |
          $stragglers = @(Get-Process mochi-testwin -ErrorAction SilentlyContinue)
          if ($stragglers.Count -gt 0) {
              $stragglers | Stop-Process -Force
              throw "$($stragglers.Count) mochi-testwin process(es) survived the test run"
          }
          Write-Output 'no mochi-testwin process left'

  e2e:
    name: end to end
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      # These tests start the real daemon against real windows, so they need an
      # interactive window station. They are opt-in through MOCHI_E2E, which
      # means the ordinary test job reports them as passed without running one
      # of them: this job is where they actually execute. The daemon manages
      # only its own window class, so nothing else on the runner is touched.
      - name: Test against real windows
        shell: pwsh
        env:
          MOCHI_E2E: "1"
          # A runner has nothing else managing its windows, so it is the one
          # place the cloak test can safely spawn a window that any other
          # window manager would take.
          MOCHI_E2E_CLOAK: "1"
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Continue'
          $output = cargo test --locked -p mochi --test e2e_testbed -- --test-threads 1 --nocapture 2>&1 | Out-String
          Write-Output $output
          if ($LASTEXITCODE -ne 0) { throw "the end-to-end suite failed with $LASTEXITCODE" }

          # A test that skips still reports as passed, so a runner without a
          # desktop would turn this job green having run nothing at all. The
          # harness prints a step tally for every test that really executed;
          # requiring it is the difference between coverage and a badge.
          $ran = ([regex]::Matches($output, 'steps passed')).Count
          Write-Output "tests that really executed: $ran"
          if ($ran -lt 9) {
              throw "only $ran end-to-end tests executed; the rest skipped and reported as passed. $(
                  '')Check the runner has an interactive desktop."
          }
      - name: No test windows left behind
        shell: pwsh
        run: |
          $stragglers = @(Get-Process mochi-testwin -ErrorAction SilentlyContinue)
          if ($stragglers.Count -gt 0) {
              $stragglers | Stop-Process -Force
              throw "$($stragglers.Count) mochi-testwin process(es) survived the run"
          }
          Write-Output 'no mochi-testwin process left'
      - name: Upload the daemon logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          # The harness writes under the process TEMP, which is not the
          # runner's temp directory.
          path: ${{ env.TEMP }}/mochi-e2e/*.log
          if-no-files-found: ignore
          retention-days: 7

  # Only on the timer, because this is the job allowed to fail for a reason
  # that is not the code's fault: it compiles against the Rust that is coming
  # rather than the Rust that is pinned. Breakage here is a heads-up with weeks
  # of warning, not a broken build.
  beta:
    name: next rust
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@beta
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: beta
      - run: cargo test --locked --workspace --all-features
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  doc:
    name: doc
    timeout-minutes: 30
    runs-on: windows-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: doc
      - run: cargo doc --locked --workspace --all-features --no-deps

  build:
    name: build release
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      # The release profile is thin LTO with one codegen unit, so it breaks in
      # ways a debug build does not. Every push walks that path.
      - run: cargo build --locked --release --workspace

  schema:
    name: schema is current
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: schema
      # `schema.json` is what an editor validates a user's mochi.json against,
      # and the config in this repository points its own `$schema` at it. A key
      # added to the parser without regenerating it means every editor marks a
      # perfectly valid setting as an error, and nothing else would ever say so.
      - name: Regenerate and compare
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          cargo run --locked --quiet -p mochic -- schema > schema.generated.json
          $committed = (Get-Content -Raw schema.json) -replace "`r`n", "`n"
          $generated = (Get-Content -Raw schema.generated.json) -replace "`r`n", "`n"
          if ($committed -ne $generated) {
              Write-Output 'schema.json is out of date. Regenerate it with:'
              Write-Output '  cargo run -p mochic -- schema > schema.json'
              git --no-pager diff --no-index -- schema.json schema.generated.json
              exit 1
          }
          Write-Output 'schema.json matches the parser'

  deny:
    name: cargo-deny
    timeout-minutes: 30
    # The one job that is not on Windows: cargo-deny-action is a container
    # action and only runs on a Linux runner. It reads Cargo.lock and the
    # advisory database, and deny.toml pins the graph to the Windows target,
    # so what it audits is the same dependency set the other jobs build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
