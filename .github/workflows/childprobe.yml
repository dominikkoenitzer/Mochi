name: child probe
on:
  push:
    branches: [childprobe]
jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: browser
            browser: ""
            flags: ""
          - name: browser-software
            browser: ""
            flags: "--flag=--disable-gpu --flag=--disable-gpu-compositing"
          - name: frameless
            browser: "--browser node_modules/electron/dist/electron.exe"
            flags: ""
          - name: frameless-software
            browser: "--browser node_modules/electron/dist/electron.exe"
            flags: "--flag=--disable-gpu --flag=--disable-gpu-compositing"
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the frameless host
        if: matrix.browser != ''
        run: |
          npm install --no-audit --no-fund --no-save electron
          node node_modules/electron/install.js
          Test-Path node_modules/electron/dist/electron.exe
      - name: Taskbar route, frames as they are
        run: python -I probe/probe.py ${{ matrix.browser }} ${{ matrix.flags }} --down -1 --settle 0.05 --cycles 200 --animate --route syscommand
      - name: Taskbar route, posted frames
        run: python -I probe/probe.py ${{ matrix.browser }} ${{ matrix.flags }} --down -1 --settle 0.05 --cycles 300 --animate --posted-frames --route syscommand
      - name: Direct minimize, posted frames
        run: python -I probe/probe.py ${{ matrix.browser }} ${{ matrix.flags }} --down -1 --settle 0.05 --cycles 200 --animate --posted-frames --route direct
      - name: Posted minimize, posted frames
        run: python -I probe/probe.py ${{ matrix.browser }} ${{ matrix.flags }} --down -1 --settle 0.05 --cycles 300 --animate --posted-frames --route posted
      - name: Posted minimize without activation, posted frames
        run: python -I probe/probe.py ${{ matrix.browser }} ${{ matrix.flags }} --down -1 --settle 0.05 --cycles 300 --animate --posted-frames --route posted --style noactivate
      - name: Maximized, minimize and restore without activation
        run: python -I probe/probe.py ${{ matrix.browser }} ${{ matrix.flags }} --down -1 --settle 0.05 --cycles 30 --route posted --style noactivate --maximized
      - name: Maximized, plain minimize and restore
        run: python -I probe/probe.py ${{ matrix.browser }} ${{ matrix.flags }} --down -1 --settle 0.05 --cycles 30 --route direct --maximized
