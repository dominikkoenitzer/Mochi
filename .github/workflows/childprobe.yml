name: child probe
on:
  push:
    branches: [childprobe]
jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            flags: ""
          - name: software
            flags: "--flag=--disable-gpu --flag=--disable-gpu-compositing"
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - name: Resized around each cycle
        run: python -I probe/probe.py ${{ matrix.flags }} --cycles 300 --down -1 --settle 0.05 --resize
      - name: Resized around each cycle, under load
        run: python -I probe/probe.py ${{ matrix.flags }} --cycles 300 --down -1 --settle 0.05 --resize --load 8
      - name: Without activation, under load
        run: python -I probe/probe.py ${{ matrix.flags }} --style noactivate --cycles 300 --down -1 --settle 0.05 --resize --load 8
  race:
    runs-on: windows-latest
    timeout-minutes: 15
    name: stand-in
    steps:
      - uses: actions/checkout@v7
      - name: Three process stand-in
        run: python -I probe/race.py --cycles 500
