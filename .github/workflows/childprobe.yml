name: child probe
on:
  push:
    branches: [childprobe]
jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            flags: ""
          - name: software
            flags: "--flag=--disable-gpu --flag=--disable-gpu-compositing"
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - name: Fixed gap
        run: python -I probe/probe.py ${{ matrix.flags }} --cycles 60 --down 0.6 --settle 0.4 --displace
      - name: Random gap, no settle
        run: python -I probe/probe.py ${{ matrix.flags }} --cycles 150 --down -1 --settle 0.05
      - name: Random gap, moved around each cycle
        run: python -I probe/probe.py ${{ matrix.flags }} --cycles 150 --down -1 --settle 0.05 --move
      - name: Without activation
        run: python -I probe/probe.py ${{ matrix.flags }} --style noactivate --cycles 60 --down 0.6 --settle 0.4
  race:
    runs-on: windows-latest
    timeout-minutes: 15
    name: stand-in
    steps:
      - uses: actions/checkout@v7
      - name: Three process stand-in
        run: python -I probe/race.py --cycles 2000
