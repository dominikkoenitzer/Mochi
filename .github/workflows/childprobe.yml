name: child probe
on:
  push:
    branches: [childprobe]
jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: browser
            browser: ""
            flags: ""
          - name: browser-software
            browser: ""
            flags: "--flag=--disable-gpu --flag=--disable-gpu-compositing"
          - name: frameless
            browser: "--browser node_modules/electron/dist/electron.exe"
            flags: ""
          - name: frameless-software
            browser: "--browser node_modules/electron/dist/electron.exe"
            flags: "--flag=--disable-gpu --flag=--disable-gpu-compositing"
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the frameless host
        if: matrix.browser != ''
        run: |
          npm install --no-audit --no-fund --no-save electron
          node node_modules/electron/install.js
          Test-Path node_modules/electron/dist/electron.exe
      - name: Frames in flight
        run: python -I probe/probe.py ${{ matrix.browser }} ${{ matrix.flags }} --cycles 150 --down -1 --settle 0.05 --animate
      - name: Frames without frame recalculation
        run: python -I probe/probe.py ${{ matrix.browser }} ${{ matrix.flags }} --cycles 150 --down -1 --settle 0.05 --animate --no-framechanged
      - name: Frames that leave out minimized windows
        run: python -I probe/probe.py ${{ matrix.browser }} ${{ matrix.flags }} --cycles 150 --down -1 --settle 0.05 --animate --skip-iconic
      - name: Several moves while minimized, one after the other
        run: python -I probe/probe.py ${{ matrix.browser }} ${{ matrix.flags }} --cycles 150 --down 0.05 --settle 0.05 --iconic 5 --gap 0.016
      - name: Frames in flight, without activation
        run: python -I probe/probe.py ${{ matrix.browser }} ${{ matrix.flags }} --cycles 150 --down -1 --settle 0.05 --animate --style noactivate
