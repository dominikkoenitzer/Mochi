name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release, for example v0.1.0. Leave empty to build the current branch and only upload the zip as a workflow artifact."
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TARGET: x86_64-pc-windows-msvc
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # The same toolchain CI uses: stable, plus rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      # Nothing is packaged that has not passed the suite first.
      - name: Test
        run: cargo test --workspace --all-features

      - name: Build
        run: cargo build --release --workspace

      - name: Stage binaries
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $tag = "${{ inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
              if ("${{ github.ref_type }}" -eq 'tag') {
                  $tag = "${{ github.ref_name }}"
              } else {
                  $tag = "${{ github.ref_name }}-$("${{ github.sha }}".Substring(0, 7))"
              }
          }
          $name = "Mochi-$tag-$env:TARGET"
          $stage = Join-Path $env:GITHUB_WORKSPACE "dist/$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/release/mochi.exe" $stage
          Copy-Item "target/release/mochic.exe" $stage
          $forward = $stage.Replace('\', '/')
          "PACKAGE_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "STAGE_DIR=$forward" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify the staged binaries run
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          foreach ($exe in @('mochi.exe', 'mochic.exe')) {
              $path = Join-Path $env:STAGE_DIR $exe
              $output = & $path --version 2>&1
              if ($LASTEXITCODE -ne 0) { throw "$exe --version exited with $LASTEXITCODE" }
              Write-Output "$exe -> $output"
          }

      - name: Generate JSON schema
        shell: bash
        run: |
          # `mochic schema` lands with the config loader. Until then the zip ships without it.
          ./target/release/mochic.exe schema > "$STAGE_DIR/mochi.schema.json" || true
          [ -s "$STAGE_DIR/mochi.schema.json" ] || rm -f "$STAGE_DIR/mochi.schema.json"

      - name: Package
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $zip = "dist/$env:PACKAGE_NAME.zip"
          Compress-Archive -Path "$env:STAGE_DIR/*" -DestinationPath $zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLower()
          "$hash  $env:PACKAGE_NAME.zip" | Set-Content -Path "$zip.sha256" -Encoding ascii
          Get-Content "$zip.sha256"

      # Always available, so a workflow_dispatch without a tag still produces a
      # zip that can be downloaded and tried.
      - name: Upload the zip as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            dist/${{ env.PACKAGE_NAME }}.zip
            dist/${{ env.PACKAGE_NAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        if: github.ref_type == 'tag' || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/${{ env.PACKAGE_NAME }}.zip
            dist/${{ env.PACKAGE_NAME }}.zip.sha256
