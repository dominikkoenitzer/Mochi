name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release, for example v0.1.0. Leave empty to build the current branch and only upload the zip as a workflow artifact."
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TARGET: x86_64-pc-windows-msvc
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # The same audit CI runs, and for the same reason: a release is the one
  # artifact strangers actually download, so it must not be the thing that
  # skipped the advisory database. It is a container action and therefore the
  # one job here that is not on Windows; `deny.toml` pins the graph to the
  # Windows target, so the dependency set it audits is the one being shipped.
  deny:
    name: cargo-deny
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  release:
    name: Build and publish
    needs: deny
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # The same toolchain CI uses: stable, plus rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      # Nothing is packaged that has not passed the suite first. A tag push
      # does not run CI, so everything CI would have said has to be said here
      # too: a release built from a commit that never saw clippy or the
      # advisory database is a release nobody checked.
      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --all-features

      - name: Doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Build
        run: cargo build --locked --release --workspace

      - name: Stage binaries
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $tag = "${{ inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
              if ("${{ github.ref_type }}" -eq 'tag') {
                  $tag = "${{ github.ref_name }}"
              } else {
                  $tag = "${{ github.ref_name }}-$("${{ github.sha }}".Substring(0, 7))"
              }
          }
          $name = "Mochi-$tag-$env:TARGET"
          $stage = Join-Path $env:GITHUB_WORKSPACE "dist/$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/release/mochi.exe" $stage
          Copy-Item "target/release/mochic.exe" $stage
          $forward = $stage.Replace('\', '/')
          "PACKAGE_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "STAGE_DIR=$forward" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify the staged binaries run and agree with the tag
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          # The tag being published, when there is one. A workflow_dispatch on a
          # branch has none, and must not be held to this.
          $tag = "${{ inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag) -and "${{ github.ref_type }}" -eq 'tag') {
              $tag = "${{ github.ref_name }}"
          }
          $expected = if ($tag -match '^v(.+)$') { $Matches[1] } else { $null }

          foreach ($exe in @('mochi.exe', 'mochic.exe')) {
              $path = Join-Path $env:STAGE_DIR $exe
              $output = (& $path --version 2>&1) -join ' '
              if ($LASTEXITCODE -ne 0) { throw "$exe --version exited with $LASTEXITCODE" }
              Write-Output "$exe -> $output"

              # Running is not the same as being the thing the tag says. Without
              # this, tagging v0.1.14 while Cargo.toml still reads 0.1.13 ships a
              # binary that reports the wrong version to every user who runs it,
              # and nothing anywhere would have said a word.
              #
              # Pulled out and compared whole, NOT matched as a substring: a
              # substring test passes '0.1.1' against a binary reporting
              # '0.1.13', which is the one mistake this check exists to catch.
              if ($expected) {
                  if ($output -notmatch '(\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.\-]+)?)') {
                      throw "could not read a version out of '$output' for $exe"
                  }
                  $actual = $Matches[1]
                  if ($actual -ne $expected) {
                      throw "$exe reports $actual but the tag is $tag; bump the workspace version before tagging"
                  }
              }
          }
          if ($expected) {
              Write-Output "both binaries agree with tag $tag"
          } else {
              Write-Output 'no tag to check against, this is a branch build'
          }

      - name: Generate JSON schema
        shell: bash
        run: ./target/release/mochic.exe schema > "$STAGE_DIR/mochi.schema.json"

      - name: Package
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $zip = "dist/$env:PACKAGE_NAME.zip"
          Compress-Archive -Path "$env:STAGE_DIR/*" -DestinationPath $zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLower()
          # LF, not CRLF: `sha256sum -c` takes the whole rest of the line as
          # the file name, so a trailing CR makes it look for a file that does
          # not exist and the check fails on a perfectly good download.
          $line = "$hash  $env:PACKAGE_NAME.zip`n"
          [System.IO.File]::WriteAllText("$env:GITHUB_WORKSPACE/$zip.sha256", $line, [System.Text.UTF8Encoding]::new($false))
          Get-Content "$zip.sha256"

      # Always available, so a workflow_dispatch without a tag still produces a
      # zip that can be downloaded and tried.
      - name: Upload the zip as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            dist/${{ env.PACKAGE_NAME }}.zip
            dist/${{ env.PACKAGE_NAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        if: github.ref_type == 'tag' || inputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/${{ env.PACKAGE_NAME }}.zip
            dist/${{ env.PACKAGE_NAME }}.zip.sha256
