name: elevated rounds
on:
  push:
    branches: [childprobe]
    paths: [.github/workflows/flake.yml]
jobs:
  rounds:
    runs-on: windows-latest
    timeout-minutes: 57
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: childrect module
            side: childrect
            tests: "elevated::"
          - cell: childrect alone
            side: childrect
            tests: "elevated::with_the_setting_on"
          - cell: main module
            side: main
            tests: "elevated::"
    name: rounds ${{ matrix.cell }}
    env:
      MOCHI_E2E: "1"
      MOCHI_E2E_CLOAK: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.side }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: rounds-${{ matrix.side }}
      - name: Build
        run: |
          git log -1 --format=%H
          cargo build --locked -p mochi-testbed --bin mochi-testwin
          if ($LASTEXITCODE -ne 0) { throw "did not compile" }
          cargo test --locked -p mochi --test e2e_testbed --no-run
          if ($LASTEXITCODE -ne 0) { throw "did not compile" }
      - name: The rounds
        run: |
          $failed = 0
          $tests = '${{ matrix.tests }}' -split ' '
          foreach ($round in 1..200) {
            cargo test --locked -p mochi --test e2e_testbed -- @tests --test-threads 1 --nocapture
            if ($LASTEXITCODE -ne 0) {
              $failed += 1
              "round $round failed"
            }
          }
          "cell ${{ matrix.cell }}: $failed of 200 rounds failed"
          exit 0
