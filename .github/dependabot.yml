version: 2
updates:
  # Cargo dependencies. Every crate takes its version from
  # [workspace.dependencies] in the root manifest, so one directory covers the
  # whole workspace. Semver-compatible bumps land in Cargo.lock; a major gets
  # its own PR, which matters most for windows and windows-core, where even a
  # 0.x bump moves the API.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # windows and windows-core are pinned to the same version on purpose and
      # their APIs move together, so a PR that bumps one alone cannot compile.
      windows:
        patterns:
          - "windows"
          - "windows-core"
      minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # windows-rs 0.100 shipped windows-core and the small crates but held
      # back the windows crate itself, which still ends at 0.62. The interface
      # macro in platform/appview.rs implements windows-core's traits, so with
      # windows-core 0.100 beside windows 0.62 the shell's QueryService no
      # longer accepts the interfaces it declares and the build breaks. Drop
      # this once windows 0.100 is on crates.io; that move is a migration of
      # its own, since 0.100 renames the Win32 modules after the SDK headers.
      - dependency-name: "windows-core"
        versions: [">= 0.100"]
    commit-message:
      prefix: deps
    labels:
      - dependencies

  # GitHub Actions used in workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - ci
