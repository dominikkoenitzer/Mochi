.shell cmd

# ─── the keyboard layout Dominik actually runs, one key at a time ───

# Focus windows (vim keys + arrows)
alt + h                 : mochic focus left
alt + j                 : mochic focus down
alt + k                 : mochic focus up
alt + l                 : mochic focus right
alt + left              : mochic focus left
alt + down              : mochic focus down
alt + up                : mochic focus up
alt + right             : mochic focus right

# Move windows (crosses monitors at the screen edge)
alt + shift + h         : mochic move left
alt + shift + j         : mochic move down
alt + shift + k         : mochic move up
alt + shift + l         : mochic move right
alt + shift + left      : mochic move left
alt + shift + down      : mochic move down
alt + shift + up        : mochic move up
alt + shift + right     : mochic move right

# Resize: u and p for width, i and o for height
alt + u                 : mochic resize-axis horizontal decrease
alt + p                 : mochic resize-axis horizontal increase
alt + i                 : mochic resize-axis vertical decrease
alt + o                 : mochic resize-axis vertical increase

# Window state
alt + shift + space     : mochic toggle-float
alt + t                 : mochic toggle-float
alt + f                 : mochic toggle-maximize
alt + shift + f         : mochic toggle-monocle
alt + m                 : mochic minimize
alt + shift + q         : mochic close

# Layouts, with alt+v stepping through the ring
alt + v                 : mochic cycle-layout next
alt + x                 : mochic flip-layout horizontal
alt + y                 : mochic flip-layout vertical

# Workspace navigation: previous, next, back to the last one
alt + a                 : mochic cycle-workspace previous
alt + s                 : mochic cycle-workspace next
alt + d                 : mochic focus-last-workspace

# Focus workspace by number
alt + 1                 : mochic focus-workspace 0
alt + 2                 : mochic focus-workspace 1
alt + 3                 : mochic focus-workspace 2
alt + 4                 : mochic focus-workspace 3
alt + 5                 : mochic focus-workspace 4
alt + 6                 : mochic focus-workspace 5
alt + 7                 : mochic focus-workspace 6
alt + 8                 : mochic focus-workspace 7
alt + 9                 : mochic focus-workspace 8

# Move focused window to workspace (and follow it)
alt + shift + 1         : mochic move-to-workspace 0
alt + shift + 2         : mochic move-to-workspace 1
alt + shift + 3         : mochic move-to-workspace 2
alt + shift + 4         : mochic move-to-workspace 3
alt + shift + 5         : mochic move-to-workspace 4
alt + shift + 6         : mochic move-to-workspace 5
alt + shift + 7         : mochic move-to-workspace 6
alt + shift + 8         : mochic move-to-workspace 7
alt + shift + 9         : mochic move-to-workspace 8

# Game mode TOGGLE: pause tiling and mute every other hotkey, press again to leave
# (this key is the only one that survives game mode, so it is always the way out)
alt + shift + g         : mochic toggle-game-mode

# Window manager control
alt + shift + p         : mochic toggle-pause
alt + shift + r         : mochic reload-configuration
alt + shift + w         : mochic retile
alt + shift + e         : mochic stop

# Launch Windows Terminal
alt + return            : start wt
