[package]
name = "mochic"
description = "Command-line client for the Mochi window manager."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mochi-client = { workspace = true, features = ["clap"] }
mochi-core = { workspace = true }
mochi-hotkey = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rmcp = { workspace = true }
schemars = { workspace = true }
tokio = { workspace = true, features = ["io-std", "rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "rt", "time"] }

[build-dependencies]
winresource = { workspace = true }
