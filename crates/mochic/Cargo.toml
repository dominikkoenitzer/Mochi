[package]
name = "mochic"
description = "Command-line client for the Mochi window manager."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mochi-client = { workspace = true, features = ["clap"] }
mochi-core = { workspace = true }
mochi-hotkey = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rmcp = { workspace = true }
regex = { workspace = true }
schemars = { workspace = true }
tokio = { workspace = true, features = ["io-std", "rt"] }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "rt", "time"] }

[build-dependencies]
winresource = { workspace = true }
