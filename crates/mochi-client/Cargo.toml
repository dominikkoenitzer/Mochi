[package]
name = "mochi-client"
description = "IPC protocol types shared by the Mochi daemon, the CLI and third-party tools."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Derives clap::ValueEnum on the small wire enums so a CLI gets real help text
# and completions for `left`, `increase`, `bsp` and friends.
clap = ["dep:clap"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
